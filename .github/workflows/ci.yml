name: 项目CI校验
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: npm install
      - name: 类型检查
        run: npm run typecheck
      - name: 项目构建
        run: npm run build
      - name: 执行测试
        run: npm test
