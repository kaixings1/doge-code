version: '3.9'

services:
  # ---- doge-code 服务 ----
  doge-code:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: doge-code:latest
    container_name: doge-code
    restart: unless-stopped
    volumes:
      - doge-data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - doge-network

  # ---- 可选: 监控 (Prometheus) ----
  prometheus:
    image: prom/prometheus:latest
    container_name: doge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - doge-network
    profiles:
      - monitoring

  # ---- 可选: 可视化 (Grafana) ----
  grafana:
    image: grafana/grafana:latest
    container_name: doge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - doge-network
    profiles:
      - monitoring

volumes:
  doge-data:
  prometheus-data:
  grafana-data:

networks:
  doge-network:
    driver: bridge
