<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工业X射线智能检测系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 主界面 -->
  <div id="mainView" class="main-view">
    <div class="main-header">
      <div class="main-logo">
        <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#0ae0ff" stroke-width="2"/><line x1="8" y1="20" x2="32" y2="20" stroke="#0ae0ff" stroke-width="2.5"/><circle cx="14" cy="20" r="2" fill="#0ae0ff"/><circle cx="20" cy="20" r="2" fill="#0ae0ff"/><circle cx="26" cy="20" r="2" fill="#0ae0ff"/><text x="20" y="37" font-size="8" fill="#0ae0ff" text-anchor="middle" font-weight="bold">X</text></svg>
        <div><h1>工业X射线智能检测系统</h1><p>Industrial X-Ray Intelligent Inspection System v2.0</p></div>
      </div>
      <div class="main-status">
        <span class="status-dot online"></span> 系统在线
        <span class="main-time" id="mainTime"></span>
      </div>
    </div>
    <div class="main-cards" id="mainCards">
      <div class="module-card" onclick="enterModule('xray')">
        <div class="card-icon">🔬</div>
        <div class="card-title">智能拍片</div>
        <div class="card-desc">X射线曝光控制 · 参数设置 · 实时成像</div>
        <div class="card-status">就绪</div>
      </div>
      <div class="module-card" onclick="enterModule('patch')">
        <div class="card-icon">🧩</div>
        <div class="card-title">智能补片</div>
        <div class="card-desc">缺陷修补 · 路径规划 · 工艺推荐</div>
        <div class="card-status">待机</div>
      </div>
      <div class="module-card" onclick="enterModule('teach')">
        <div class="card-icon">📐</div>
        <div class="card-title">示教产品</div>
        <div class="card-desc">机器人示教 · 点位编程 · 轨迹复现</div>
        <div class="card-status">待机</div>
      </div>
      <div class="module-card" onclick="enterModule('settings')">
        <div class="card-icon">⚙️</div>
        <div class="card-title">系统设置</div>
        <div class="card-desc">设备参数 · 用户管理 · 系统配置</div>
        <div class="card-status">正常</div>
      </div>
    </div>
    <div class="main-footer">
      <div>设备: DR-X200 | 六轴机器人协同</div>
      <div>累计检测: <span id="totalInspections">0</span> 件 | 今日: <span id="todayInspections">0</span> 件</div>
    </div>
  </div>

  <!-- 子模块视图 -->
  <div id="moduleView" class="module-view" style="display:none">
    <div class="module-header">
      <button class="back-btn" onclick="backToMain()">← 返回主界面</button>
      <h2 id="moduleTitle">智能拍片</h2>
      <div class="module-header-right">
        <span class="status-dot online"></span><span id="moduleStatus">就绪</span>
      </div>
    </div>
    <div id="moduleContent" class="module-content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
<div class="modal" id="modalContent"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
