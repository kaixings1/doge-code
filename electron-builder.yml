appId: com.doge-code.desktop
productName: DogeCode
copyright: Copyright © 2026 kaixings
directories:
  output: desktop-electron/release
  buildResources: desktop-electron/build
files:
  - desktop-electron/dist/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
  icon: desktop-electron/build/icon.ico
  artifactName: DogeCode-Setup-${version}.${ext}
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DogeCode
  installerIcon: desktop-electron/build/icon.ico
  uninstallerIcon: desktop-electron/build/icon.ico
  license: LICENSE
portable:
  artifactName: DogeCode-Portable-${version}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: desktop-electron/build/icon.icns
  category: public.app-category.developer-tools
  artifactName: DogeCode-${version}-${arch}.dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop-electron/build/entitlements.mac.plist
  entitlementsInherit: desktop-electron/build/entitlements.mac.plist
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: desktop-electron/build/icons
  category: Development
  artifactName: DogeCode-${version}-${arch}.${ext}
  maintainer: kaixings <30445355@qq.com>
  vendor: DogeCode
  synopsis: AI-powered coding assistant
  description: Doge Code Desktop - AI-powered coding assistant built with Electron
publish:
  provider: github
  owner: kaixings
  repo: doge-code
  releaseType: release
compression: maximum
asar: true
asarUnpack:
  - '**/node_modules/{@electron,electron-updater}/**'
  - '**/node_modules/node-pty/**'
