# 项目审计工具配置文件
# 项目根目录（默认为当前目录）
PROJECT_ROOT=.

# 需要忽略的目录/文件（支持通配符，逗号分隔）
IGNORE_PATTERNS=node_modules,.git,dist,build,output,tests

# 文档目录路径
DOCS_DIR=./docs

# 文档匹配规则（支持通配符，逗号分隔）
DOC_PATTERNS=*.md,*.txt,*.conf,*.json

# 输出目录
OUTPUT_DIR=./output

# 报告格式：markdown/json
REPORT_FORMAT=markdown

# 扫描的文件扩展名（支持通配符，逗号分隔）
SCAN_EXTENSIONS=*.sh,*.py,*.js,*.ts,*.md,*.txt,*.json,*.yaml,*.yml,*.conf
